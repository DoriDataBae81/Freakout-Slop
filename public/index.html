<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Freakout Slop</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="brand-mark">▣</span>
      <span class="brand-name">Freakout Slop</span>
    </div>
    <button id="submit-toggle" class="btn btn-accent">+ Submit</button>
  </header>

  <main class="container">
    <div id="submit-panel" class="submit-panel hidden">
      <input id="title-input" type="text" placeholder="Title" maxlength="140" />
      <input id="url-input" type="text" placeholder="Video URL (YouTube link works)" />
      <button id="submit-btn" class="btn btn-accent">Submit</button>
    </div>

    <div id="grid" class="grid"></div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
